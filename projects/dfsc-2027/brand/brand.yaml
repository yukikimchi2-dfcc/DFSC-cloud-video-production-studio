# DFSC 2027 — 第十一屆 圓夢工場。創業大賽 · 啟航 北極星 · Find Your North Star
# Source of truth: brand/source/DFSC_2027_Key_visual.ai (Illustrator 24.1, 2026-09-30)
# Status: colours + logos extracted from the key visual; motion rules are UNREVIEWED proposals.
name: DFSC 2027
status: key_visual_extracted

colors:
  # Swatches confirmed by the designer in Illustrator's Colour panel:
  green: "#47B649"        # RGB 71,182,73 — primary background / 啟航 wordmark
  blue: "#1C61AE"         # RGB 28,97,174 — star face + stem (embedded PDF renders #1861AE after CMYK conversion)
  black: "#231F20"        # K100 rich black as exported (the north star, body text)
  white: "#FFFFFF"
  # Seen in the artwork but not declared as swatches:
  lockup_green: "#36B44A" # English line "Dream Factory Startup Contest" + paper plane
  lockup_black: "#1A1B1B" # 圓夢工場。創業大賽 characters
  # Semantic roles used by templates:
  primary: "#47B649"
  secondary: "#1C61AE"
  accent: "#FFFFFF"
  background: "#47B649"
  text: "#FFFFFF"
  text_on_light: "#231F20"

fonts:
  # The key visual uses PingFang HK (Apple, not licensable for Linux servers) for CJK and
  # Noto Sans SC Thin for "2027 / Find Your North Star". Cloud substitutes below are the
  # closest free equivalents (Noto Sans CJK **HK** face = Hong Kong glyph standard, like PingFang HK);
  # drop licensed .otf files into brand/fonts/ and point here to replace.
  title: {system: cjk_black_hk}
  heading: {system: cjk_bold_hk}
  body: {system: cjk_regular_hk}
  subtitle: {system: cjk_bold_hk}
  numerals_thin: {system: cjk_thin_hk}   # matches the thin "2027" numerals

logos:
  north_star_tricolor: logos/north_star_tricolor.json
  north_star_black: logos/north_star_black.json
  qihang_wordmark: logos/qihang_wordmark.json
  dfsc_lockup: logos/dfsc_lockup.json
  paper_plane: logos/paper_plane.json

copy:
  edition: 第十一屆
  theme_zh: 啟航 北極星
  theme_en: Find Your North Star
  name_zh: 圓夢工場。創業大賽
  name_en: Dream Factory Startup Contest
  year: "2027"

# Proposed motion language derived from the key visual — UNREVIEWED until a reviewer approves.
motion:
  review_status: UNREVIEWED
  layout: four-quadrant grid with thin guide rectangles; white / green panels alternate
  signature_moves:
    - north star spins in and settles at 45° (the X), stem extends upward like a compass needle
    - thin 1px guide rectangles draw on before content (architectural / blueprint feel)
    - vertical stacked CJK (第 十 一 屆, 北 極 星) revealed one character at a time
    - thin numerals "2027" with the star inside the 0
  easing_default: out_expo
  avoid: [glow-heavy neon, rainbow gradients, emoji stickers on brand cards]
